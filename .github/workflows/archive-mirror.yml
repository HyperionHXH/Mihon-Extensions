name: Archive extension mirror

on:
  workflow_dispatch:
  schedule:
    - cron: "41 4 * * 2"

permissions: {}

concurrency:
  group: extension-index
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - name: Check out repository without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Locate Android verification tools
        run: |
          apksigner=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)
          aapt=$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)
          test -x "$apksigner"
          test -x "$aapt"
          echo "APKSIGNER=$apksigner" >> "$GITHUB_ENV"
          echo "AAPT=$aapt" >> "$GITHUB_ENV"

      - name: Scan tracked files
        run: python tools/security_scan.py

      - name: Build unmirrored upstream index
        run: python tools/build_index.py --ignore-archive --output archive-work/upstream

      - name: Download and verify archive candidates
        run: |
          python tools/archive_extensions.py \
            --index archive-work/upstream/index.json \
            --output archive-work/result \
            --repository "$GITHUB_REPOSITORY" \
            --apksigner "$APKSIGNER" \
            --aapt "$AAPT"

      - name: Prepare verified archive bundle
        run: |
          mv archive-work/result archive-bundle
          (cd archive-bundle && find . -type f ! -name sha256sums.txt -print0 | sort -z | xargs -0 sha256sum > sha256sums.txt)

      - name: Upload verified archive bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: extension-archive
          path: archive-bundle
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.ARCHIVE_PUBLISH_TOKEN || github.token }}
    steps:
      - name: Check out repository for publishing
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Download archive bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: extension-archive
          path: archive-bundle

      - name: Verify archive bundle
        run: (cd archive-bundle && sha256sum -c sha256sums.txt)

      - name: Create releases and upload changed assets
        run: |
          mapfile -t shards < <(python -c 'import json; print(*range(json.load(open("archive-bundle/archive-manifest.json"))["releaseShardCount"]), sep="\n")')
          for shard in "${shards[@]}"; do
            tag="extension-archive-$shard"
            if ! gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              gh release create "$tag" \
                --repo "$GITHUB_REPOSITORY" \
                --target main \
                --title "Extension archive shard $shard" \
                --notes "Verified extension archive managed by archive-mirror.yml."
            fi

            release_id=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$tag" --jq .id)
            gh api --paginate "repos/$GITHUB_REPOSITORY/releases/$release_id/assets?per_page=100" --jq '.[].name' | sort > "uploaded-$shard.txt"
            mapfile -t uploads < <(find "archive-bundle/assets/shard-$shard" -maxdepth 1 -type f 2>/dev/null | sort)
            for asset in "${uploads[@]}"; do
              name=$(basename "$asset")
              if grep -Fqx "$name" "uploaded-$shard.txt"; then
                continue
              fi

              uploaded=false
              for attempt in 1 2 3 4 5; do
                if gh release upload "$tag" "$asset" --repo "$GITHUB_REPOSITORY"; then
                  uploaded=true
                  break
                fi
                gh api --paginate "repos/$GITHUB_REPOSITORY/releases/$release_id/assets?per_page=100" --jq '.[].name' | sort > "uploaded-$shard.txt"
                if grep -Fqx "$name" "uploaded-$shard.txt"; then
                  uploaded=true
                  break
                fi
                sleep $((attempt * 30))
              done
              $uploaded || exit 1
              sleep 0.5
            done
          done

      - name: Prune assets outside the retention manifest
        run: |
          mapfile -t shards < <(python -c 'import json; print(*range(json.load(open("archive-bundle/archive-manifest.json"))["releaseShardCount"]), sep="\n")')
          for shard in "${shards[@]}"; do
            tag="extension-archive-$shard"
            release_id=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$tag" --jq .id)
            gh api --paginate "repos/$GITHUB_REPOSITORY/releases/$release_id/assets?per_page=100" --jq '.[].name' | sort > "existing-$shard.txt"
            comm -23 "existing-$shard.txt" "archive-bundle/desired-assets/shard-$shard.txt" > "prune-$shard.txt"
            while IFS= read -r asset; do
              test -z "$asset" || gh release delete-asset "$tag" "$asset" --yes --repo "$GITHUB_REPOSITORY"
            done < "prune-$shard.txt"
          done

      - name: Install manifest and rebuild index
        run: |
          cp archive-bundle/archive-manifest.json repo/archive-manifest.json
          cp archive-bundle/archive-report.json repo/archive-report.json
          python tools/build_index.py
          python tools/validate_index.py

      - name: Summarize archive result
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          report = json.loads(Path("repo/archive-report.json").read_text(encoding="utf-8"))
          summary = Path(os.environ["GITHUB_STEP_SUMMARY"])
          failures = report["failures"]
          with summary.open("a", encoding="utf-8") as output:
              output.write("## Extension archive\n\n")
              output.write(f"- Selected: {report['selected']}\n")
              output.write(f"- Archived or repaired: {report['archivedOrRepaired']}\n")
              output.write(f"- Reused: {report['reused']}\n")
              output.write(f"- Failures: {len(failures)}\n")
              for failure in failures[:50]:
                  output.write(f"- `{failure['packageName']}`: {failure['error']}\n")
          PY

      - name: Commit archive state and refreshed index
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add repo/archive-manifest.json repo/archive-report.json repo/index.json repo/index.min.json repo/repo.json repo/checksums.json repo/build-report.json
          git diff --cached --quiet || git commit -m "Refresh extension archive"
          git push

      - name: Require a complete archive run
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          failures = json.loads(
              Path("repo/archive-report.json").read_text(encoding="utf-8"),
          )["failures"]
          if failures:
              raise SystemExit(f"archive completed with {len(failures)} reported failure(s)")
          PY
