name: Refresh extension index

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/refresh-index.yml"
      - "config/**"
      - "repo/apk/**"
      - "repo/jar/**"
      - "repo/icon-*"
      - "repo/komikku/**"
      - "tools/**"
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"

permissions: {}

concurrency:
  group: extension-index
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out repository without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Scan tracked files
        run: python tools/security_scan.py

      - name: Rebuild and validate index
        run: |
          python tools/build_index.py
          python tools/validate_index.py --check-urls --url-report repo/url-report.json

      - name: Prepare verified index bundle
        run: |
          mkdir index-bundle
          cp repo/index.json repo/index.min.json repo/repo.json repo/checksums.json repo/build-report.json repo/url-report.json index-bundle/
          cp -R repo/komikku index-bundle/komikku
          (cd index-bundle && find . -type f ! -name sha256sums.txt -print0 | sort -z | xargs -0 sha256sum > sha256sums.txt)

      - name: Upload verified index bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: extension-index
          path: index-bundle
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Check out repository for publishing
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download index bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: extension-index
          path: index-bundle

      - name: Verify and install index bundle
        run: |
          (cd index-bundle && sha256sum -c sha256sums.txt)
          cp index-bundle/*.json repo/
          rm -rf repo/komikku
          cp -R index-bundle/komikku repo/komikku

      - name: Commit refreshed index
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add repo/index.json repo/index.min.json repo/repo.json repo/checksums.json repo/build-report.json repo/url-report.json repo/komikku
          git diff --cached --quiet || git commit -m "Refresh extension index"
          git push
