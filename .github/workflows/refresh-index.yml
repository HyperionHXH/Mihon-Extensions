name: Refresh extension index

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Rebuild and validate index
        run: |
          python tools/build_index.py
          python tools/validate_index.py

      - name: Commit refreshed index
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add repo/index.json repo/index.min.json repo/repo.json repo/checksums.json
          git diff --cached --quiet || git commit -m "Refresh extension index"
          git push
